app = "telegram-ai-bridge"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[services.http_checks]]
  path = "/healthz"
  interval = "30s"
  timeout = "5s"

[env]
  WORK_DIR = "/app"
